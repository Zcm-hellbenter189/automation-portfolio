[pytest]
# pythonpath: 把本目录注入 sys.path，使 `from core import ...` 不再依赖 cwd
#             （pytest >= 7.0 原生支持，requirements.txt 已声明 pytest>=7.0）
#             修复前：只能在 01-api-test-framework 目录下执行 pytest，在仓库根执行会全部 import 失败
pythonpath = .
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: 耗时较长的用例（日常用 -m "not slow" 跳过，CI 全量执行）
addopts = -q --html=reports/report.html --self-contained-html
filterwarnings =
    ignore::DeprecationWarning

# 终端实时日志（live log）：默认**关闭**，保持终端干净（只有进度点 + 结果摘要）
#   - 日志在报告里照旧完整保留（"Captured log" 段），不受这里影响
#   - 排查问题时想实时看日志，临时开启即可，无需改文件:
#       pytest -o log_cli=true -o log_cli_level=INFO
#     （它走 live log 通道、不进入 report.sections，所以不会造成报告重复；
#       格式自动继承下面的 log_format）
log_cli = false

# 报告里 "Captured log" 段的格式：与文件日志保持一致（默认格式不含时间戳）
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s

# 注意：去重是在 utils/logger.py 做的（pytest 运行时不写 stderr），
#       不要试图用 --show-capture 去掉报告里的 "Captured stderr"——
#       pytest-html 直接渲染 report.sections，不读该选项，HTML 报告里照样重复。
#       （该选项只在需要"终端上不重复打印 log 段"时才有用: --show-capture=stdout）
