[pytest]
# pythonpath: 把本目录注入 sys.path，使 `from core import ...` 不再依赖 cwd
#             （pytest >= 7.0 原生支持，requirements.txt 已声明 pytest>=7.0）
#             修复前：只能在 01-api-test-framework 目录下执行 pytest，在仓库根执行会全部 import 失败
pythonpath = .
# 只收集 testcases/ 下的用例（避免误收 reports/ 等产物目录）
testpaths = testcases
python_files = test_*.py       # 用例文件命名：test_*.py
python_classes = Test*         # 用例类命名（本项目用函数式用例，此项为惯例保留）
python_functions = test_*      # 用例函数命名：test_*
markers =
    slow: 耗时较长的用例（日常用 -m "not slow" 跳过，CI 全量执行）
# addopts: 默认附加参数。`--html` 让每次 pytest 都产出 HTML 报告
#          （run.py 也会显式传同名参数，两处口径一致；单独跑 pytest 时靠这里）。
#          `--self-contained-html` = 把 CSS/JS 内联进单个文件，双击即可看，无需附带资源目录。
addopts = -q --html=reports/report.html --self-contained-html
# filterwarnings: 忽略第三方库抛出的 DeprecationWarning，避免污染测试结果摘要。
#                 ⚠️ 它是**全量忽略** —— 将来若要追自己的弃用告警，需改成更精确的过滤规则。
filterwarnings =
    ignore::DeprecationWarning

# 参数化用例 id 里的非 ASCII 字符（中文）默认会被 pytest 转义成 \uXXXX，
# 报告 / junit.xml / Jenkins 用例列表里看到的都是：
#     test_login[\u6b63\u786e\u8d26\u53f7\u5bc6\u7801\u767b\u5f55\u6210\u529f]
# 转义来源（核对版本：pytest 9.1.1）：_pytest/python.py:1561 `_ascii_escaped_by_config()` → _pytest/compat.py:196 `ascii_escaped()`
#   ⚠️ 这两处是**库内部行号**，pytest 升级后必然漂移 —— 升级后请按**函数名**重新定位。
# 下方置 true 后 id 保留 yaml 里的中文原文，报告可读性直接恢复正常。
# 官方把选项名起得如此劝退（"放弃一切社区支持权利"）是因为：nodeid 变成非 ASCII 后，
# 某些老旧终端/第三方插件可能显示乱码。本项目已由 run.py 设 PYTHONIOENCODING=utf-8
# 兜底（见 run.py:198），PyCharm/Jenkins 也都是 UTF-8，风险可接受。
# 已知副作用：nodeid 变了会让 .pytest_cache 的 lastfailed、`-k` 表达式、
# Jenkins 的历史用例名**匹配失败一次**（无害，重跑一轮即恢复）。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# 终端实时日志（live log）：默认**关闭**，保持终端干净（只有进度点 + 结果摘要）
#   - 日志在报告里照旧完整保留（"Captured log" 段），不受这里影响
#   - 排查问题时想实时看日志，临时开启即可，无需改文件:
#       pytest -o log_cli=true -o log_cli_level=INFO
#     （它走 live log 通道、不进入 report.sections，所以不会造成报告重复；
#       格式自动继承下面的 log_format）
log_cli = false

# 报告里 "Captured log" 段的格式：与文件日志保持一致（默认格式不含时间戳）
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s

# 注意：去重是在 utils/logger.py 做的（pytest 运行时不写 stderr），
#       不要试图用 --show-capture 去掉报告里的 "Captured stderr"——
#       pytest-html 直接渲染 report.sections，不读该选项，HTML 报告里照样重复。
#       （该选项只在需要"终端上不重复打印 log 段"时才有用: --show-capture=stdout）
