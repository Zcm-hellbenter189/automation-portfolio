# RPA 定时监控配置
# 用法: python main.py（单次）/ python run_scheduled.py（常驻定时）

# 监控目标（可配置多个；默认指向本地演示服务，改 URL 即可监控真实站点）
targets:
  - name: "健康检查接口"
    url: "http://127.0.0.1:8100/api/health"
    expected_status: 200
  - name: "慢响应接口"
    url: "http://127.0.0.1:8100/api/slow"
    expected_status: 200
  - name: "异常接口(500)"
    url: "http://127.0.0.1:8100/api/error"
    expected_status: 200

# 异常判定规则
rules:
  max_response_time: 2.0     # 响应超过 2 秒视为过慢
  deviation_ratio: 0.5       # 响应时间环比波动超 50% 视为异常（定时模式生效）

# 调度（run_scheduled.py 使用）
schedule:
  interval_seconds: 60

# 告警：默认仅日志 + Excel 告警页；填入 SMTP 并置 enabled=true 才发邮件
alert:
  smtp:
    enabled: false
    host: "smtp.qq.com"
    port: 465
    user: "your@qq.com"
    password: "SMTP授权码"
    to: "your@qq.com"

storage:
  db_path: "data/monitor.db"
  report_dir: "reports"
